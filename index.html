<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola - Inventario Dominion</title>
  <style>
    :root {
      --fondo: #0f172a;
      --texto: #f8fafc;
      --acento: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 16px;
    }
    h1 {
      font-size: clamp(3rem, 12vw, 7rem);
      color: var(--acento);
    }
    p { font-size: 1.1rem; opacity: 0.8; }
    button {
      margin-top: 1rem;
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 999px;
      background: var(--acento);
      color: var(--fondo);
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <h1>¡Hola! 👋</h1>
  <p>Esta página se publicó automáticamente desde GitHub.</p>
  <button id="saludar">Saludar</button>
  <p id="mensaje"></p>

  <script>
    let veces = 0;
    document.getElementById("saludar").addEventListener("click", () => {
      veces++;
      document.getElementById("mensaje").textContent =
        "¡Hola de nuevo! Has saludado " + veces + (veces === 1 ? " vez." : " veces.");
    });
  </script>
</body>
</html>
